kind = "web"
previewPath = "/"
title = "WI Estate Cleanout"
version = "1.0.0"
id = "artifacts/wi-estate-cleanout"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25995

[services.development]
run = "pnpm --filter @workspace/wi-estate-cleanout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wi-estate-cleanout", "run", "build" ]
publicDir = "artifacts/wi-estate-cleanout/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25995"
BASE_PATH = "/"
